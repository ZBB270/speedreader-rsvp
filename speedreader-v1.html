<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hızlı Okuma</title>
<style>
  :root {
    --bg: #1b1e26;
    --panel: #242833;
    --panel-2: #2c313f;
    --accent: #4f8cff;
    --accent-2: #ff5a5a;
    --text: #eef1f7;
    --muted: #8b93a7;
    --border: #383e4d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  .wrap {
    max-width: 1000px;
    margin: 0 auto;
    padding: 24px 16px 60px;
  }
  h1 {
    font-size: 22px;
    font-weight: 600;
    margin: 0 0 4px;
  }
  .subtitle {
    color: var(--muted);
    font-size: 13px;
    margin-bottom: 20px;
  }

  .stage {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 0;
    overflow: hidden;
    margin-bottom: 16px;
  }

  .display {
    height: 220px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    background:
      radial-gradient(ellipse at center, rgba(79,140,255,0.06), transparent 70%);
  }
  .display .guide-line {
    position: absolute;
    top: 0; bottom: 0;
    width: 1px;
    background: rgba(79,140,255,0.25);
  }
  .guide-left { left: 50%; margin-left: -70px; }
  .guide-right { left: 50%; margin-left: 70px; }

  .word {
    font-size: 46px;
    font-weight: 600;
    letter-spacing: 0.5px;
    white-space: pre;
    text-align: center;
  }
  .word .orp {
    color: var(--accent-2);
  }

  .placeholder {
    color: var(--muted);
    font-size: 15px;
  }

  .progress-row {
    padding: 10px 18px 16px;
  }
  .progress-bar {
    height: 8px;
    background: var(--panel-2);
    border-radius: 4px;
    cursor: pointer;
    position: relative;
    overflow: hidden;
  }
  .progress-fill {
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 0%;
    background: var(--accent);
    border-radius: 4px;
  }
  .progress-meta {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--muted);
    margin-top: 6px;
  }

  .controls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 4px 18px 20px;
    flex-wrap: wrap;
  }
  button {
    border: none;
    border-radius: 10px;
    padding: 10px 18px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.05s ease, background 0.15s ease;
  }
  button:active { transform: scale(0.96); }
  .btn-primary {
    background: var(--accent);
    color: white;
    min-width: 110px;
  }
  .btn-secondary {
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
  }
  .btn-secondary:hover { background: #343a49; }

  .panels {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }
  @media (max-width: 720px) {
    .panels { grid-template-columns: 1fr; }
  }

  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px 18px;
  }
  .panel h2 {
    font-size: 14px;
    font-weight: 600;
    margin: 0 0 12px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  textarea {
    width: 100%;
    min-height: 160px;
    resize: vertical;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    padding: 12px;
    font-size: 14px;
    line-height: 1.5;
    font-family: inherit;
  }
  textarea:focus, .progress-bar:focus { outline: 2px solid var(--accent); }

  .field {
    margin-bottom: 16px;
  }
  .field:last-child { margin-bottom: 0; }
  .field label {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    color: var(--text);
    margin-bottom: 6px;
  }
  .field label span.value {
    color: var(--accent);
    font-weight: 600;
  }
  input[type="range"] {
    width: 100%;
    accent-color: var(--accent);
  }

  .row2 {
    display: flex;
    gap: 12px;
  }
  .row2 .field { flex: 1; }

  .stat-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-top: 4px;
  }
  .stat {
    background: var(--panel-2);
    border-radius: 10px;
    padding: 10px;
    text-align: center;
  }
  .stat .n { font-size: 18px; font-weight: 700; }
  .stat .l { font-size: 11px; color: var(--muted); margin-top: 2px; }

  select {
    width: 100%;
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 8px;
    font-size: 13px;
  }
  .hint {
    font-size: 12px;
    color: var(--muted);
    margin-top: 10px;
    line-height: 1.5;
  }
  kbd {
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 1px 6px;
    font-size: 11px;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Hızlı Okuma</h1>
  <div class="subtitle">Metnini yapıştır, hızı ve gösterilecek kelime sayısını ayarla, okumaya başla.</div>

  <div class="stage">
    <div class="display" id="display">
      <div class="guide-line guide-left"></div>
      <div class="guide-line guide-right"></div>
      <div class="placeholder" id="placeholder">Aşağıya metnini yapıştır ve "Başlat"a bas</div>
      <div class="word" id="word" style="display:none;"></div>
    </div>
    <div class="progress-row">
      <div class="progress-bar" id="progressBar" tabindex="0">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <div class="progress-meta">
        <span id="progressText">0 / 0 kelime</span>
        <span id="timeText">00:00 / 00:00</span>
      </div>
    </div>
    <div class="controls">
      <button class="btn-secondary" id="backBtn" title="10 kelime geri">« 10</button>
      <button class="btn-primary" id="playBtn">Başlat</button>
      <button class="btn-secondary" id="resetBtn">Sıfırla</button>
      <button class="btn-secondary" id="fwdBtn" title="10 kelime ileri">10 »</button>
    </div>
  </div>

  <div class="panels">
    <div class="panel">
      <h2>Metin</h2>
      <textarea id="textInput" placeholder="Okumak istediğin metni buraya yapıştır...">Hızlı okuma, gözlerin metin üzerinde daha az durarak daha fazla kelimeyi kısa sürede algılamasını sağlayan bir tekniktir. Bu uygulama, kelimeleri ekranın ortasında tek tek veya gruplar halinde art arda göstererek gözlerin sağa sola hareket etme ihtiyacını ortadan kaldırır. Hızını yavaş başlangıç seviyesinden başlatıp zamanla artırarak, hem okuma hızını hem de anlama becerini geliştirebilirsin. İstediğin zaman durdurabilir, geri sarabilir ya da baştan başlayabilirsin.</textarea>
      <div class="hint">
        Kısayollar: <kbd>Boşluk</kbd> Başlat/Durdur, <kbd>←</kbd> <kbd>→</kbd> 10 kelime geri/ileri, <kbd>R</kbd> Sıfırla
      </div>
    </div>

    <div class="panel">
      <h2>Ayarlar</h2>
      <div class="field">
        <label>Hız (dakikada kelime) <span class="value" id="wpmValue">300</span></label>
        <input type="range" id="wpmSlider" min="60" max="1200" step="10" value="300">
      </div>
      <div class="row2">
        <div class="field">
          <label>Kelime grubu <span class="value" id="groupValue">1</span></label>
          <input type="range" id="groupSlider" min="1" max="6" step="1" value="1">
        </div>
        <div class="field">
          <label>Yazı boyutu <span class="value" id="fontValue">46</span></label>
          <input type="range" id="fontSlider" min="24" max="80" step="2" value="46">
        </div>
      </div>
      <div class="field">
        <label>Odak noktası vurgusu</label>
        <select id="orpSelect">
          <option value="on" selected>Açık (kelimenin odak harfi kırmızı)</option>
          <option value="off">Kapalı</option>
        </select>
      </div>
      <div class="stat-grid">
        <div class="stat"><div class="n" id="statWords">0</div><div class="l">toplam kelime</div></div>
        <div class="stat"><div class="n" id="statMinutes">0</div><div class="l">tahmini dakika</div></div>
        <div class="stat"><div class="n" id="statWpm">300</div><div class="l">wpm</div></div>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  const textInput = document.getElementById('textInput');
  const wordEl = document.getElementById('word');
  const placeholder = document.getElementById('placeholder');
  const playBtn = document.getElementById('playBtn');
  const resetBtn = document.getElementById('resetBtn');
  const backBtn = document.getElementById('backBtn');
  const fwdBtn = document.getElementById('fwdBtn');
  const wpmSlider = document.getElementById('wpmSlider');
  const groupSlider = document.getElementById('groupSlider');
  const fontSlider = document.getElementById('fontSlider');
  const orpSelect = document.getElementById('orpSelect');
  const wpmValue = document.getElementById('wpmValue');
  const groupValue = document.getElementById('groupValue');
  const fontValue = document.getElementById('fontValue');
  const progressBar = document.getElementById('progressBar');
  const progressFill = document.getElementById('progressFill');
  const progressText = document.getElementById('progressText');
  const timeText = document.getElementById('timeText');
  const statWords = document.getElementById('statWords');
  const statMinutes = document.getElementById('statMinutes');
  const statWpm = document.getElementById('statWpm');

  let words = [];
  let index = 0;
  let playing = false;
  let timer = null;

  function tokenize(text) {
    return text.replace(/\s+/g, ' ').trim().split(' ').filter(Boolean);
  }

  function currentGroupSize() {
    return parseInt(groupSlider.value, 10);
  }

  function totalGroups() {
    return Math.ceil(words.length / currentGroupSize());
  }

  function msPerGroup() {
    const wpm = parseInt(wpmSlider.value, 10);
    const groupSize = currentGroupSize();
    const msPerWord = 60000 / wpm;
    return msPerWord * groupSize;
  }

  function formatTime(sec) {
    sec = Math.max(0, Math.round(sec));
    const m = Math.floor(sec / 60);
    const s = sec % 60;
    return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
  }

  function renderPlaceholderState() {
    const hasWords = words.length > 0;
    placeholder.style.display = hasWords ? 'none' : 'block';
    wordEl.style.display = hasWords ? 'block' : 'none';
  }

  function orpSplit(word) {
    // Optical Recognition Point: pick a letter near-center to highlight
    const len = word.length;
    if (len <= 1) return { pre: '', mid: word, post: '' };
    let pivot = Math.floor(len * 0.35);
    if (pivot >= len) pivot = len - 1;
    return { pre: word.slice(0, pivot), mid: word[pivot], post: word.slice(pivot + 1) };
  }

  function renderGroup() {
    const groupSize = currentGroupSize();
    const start = index * groupSize;
    const slice = words.slice(start, start + groupSize);
    if (slice.length === 0) {
      wordEl.textContent = '';
      return;
    }
    const text = slice.join(' ');
    if (orpSelect.value === 'on' && groupSize === 1) {
      const { pre, mid, post } = orpSplit(text);
      wordEl.innerHTML = escapeHtml(pre) + '<span class="orp">' + escapeHtml(mid) + '</span>' + escapeHtml(post);
    } else {
      wordEl.textContent = text;
    }
    updateProgress();
  }

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function updateProgress() {
    const total = totalGroups();
    const shown = Math.min(index + 1, total);
    const pct = total > 0 ? (shown / total) * 100 : 0;
    progressFill.style.width = pct + '%';

    const groupSize = currentGroupSize();
    const wordsShown = Math.min(shown * groupSize, words.length);
    progressText.textContent = wordsShown + ' / ' + words.length + ' kelime';

    const wpm = parseInt(wpmSlider.value, 10);
    const totalSec = (words.length / wpm) * 60;
    const elapsedSec = (wordsShown / wpm) * 60;
    timeText.textContent = formatTime(elapsedSec) + ' / ' + formatTime(totalSec);
  }

  function loadWords() {
    words = tokenize(textInput.value);
    index = 0;
    renderPlaceholderState();
    updateStats();
    if (words.length > 0) renderGroup(); else updateProgress();
  }

  function updateStats() {
    statWords.textContent = words.length;
    const wpm = parseInt(wpmSlider.value, 10);
    statMinutes.textContent = words.length ? (words.length / wpm).toFixed(1) : '0';
    statWpm.textContent = wpm;
  }

  function step() {
    const total = totalGroups();
    if (index >= total - 1) {
      index = total - 1;
      renderGroup();
      pause();
      return;
    }
    index++;
    renderGroup();
  }

  function play() {
    if (words.length === 0) {
      loadWords();
      if (words.length === 0) return;
    }
    const total = totalGroups();
    if (index >= total - 1) index = 0;
    playing = true;
    playBtn.textContent = 'Durdur';
    renderGroup();
    clearInterval(timer);
    timer = setInterval(step, msPerGroup());
  }

  function pause() {
    playing = false;
    playBtn.textContent = 'Başlat';
    clearInterval(timer);
    timer = null;
  }

  function togglePlay() {
    if (playing) pause(); else play();
  }

  function resetAll() {
    pause();
    index = 0;
    if (words.length === 0) loadWords();
    renderGroup();
  }

  function seekBy(deltaWords) {
    if (words.length === 0) loadWords();
    const groupSize = currentGroupSize();
    const deltaGroups = Math.round(deltaWords / groupSize) || (deltaWords > 0 ? 1 : -1);
    const total = totalGroups();
    index = Math.min(Math.max(0, index + deltaGroups), Math.max(0, total - 1));
    renderGroup();
  }

  function restartTimerIfPlaying() {
    if (playing) {
      clearInterval(timer);
      timer = setInterval(step, msPerGroup());
    }
  }

  playBtn.addEventListener('click', togglePlay);
  resetBtn.addEventListener('click', resetAll);
  backBtn.addEventListener('click', () => seekBy(-10));
  fwdBtn.addEventListener('click', () => seekBy(10));

  wpmSlider.addEventListener('input', () => {
    wpmValue.textContent = wpmSlider.value;
    updateStats();
    updateProgress();
    restartTimerIfPlaying();
  });

  groupSlider.addEventListener('input', () => {
    groupValue.textContent = groupSlider.value;
    const groupSize = currentGroupSize();
    const startWord = index * groupSize;
    index = Math.floor(startWord / groupSize);
    renderGroup();
    restartTimerIfPlaying();
  });

  fontSlider.addEventListener('input', () => {
    fontValue.textContent = fontSlider.value;
    wordEl.style.fontSize = fontSlider.value + 'px';
  });

  orpSelect.addEventListener('change', renderGroup);

  textInput.addEventListener('input', () => {
    pause();
    loadWords();
  });

  progressBar.addEventListener('click', (e) => {
    const rect = progressBar.getBoundingClientRect();
    const ratio = Math.min(1, Math.max(0, (e.clientX - rect.left) / rect.width));
    const total = totalGroups();
    index = Math.min(total - 1, Math.floor(ratio * total));
    renderGroup();
  });

  document.addEventListener('keydown', (e) => {
    if (document.activeElement === textInput) return;
    if (e.code === 'Space') {
      e.preventDefault();
      togglePlay();
    } else if (e.code === 'ArrowRight') {
      seekBy(10);
    } else if (e.code === 'ArrowLeft') {
      seekBy(-10);
    } else if (e.key.toLowerCase() === 'r') {
      resetAll();
    }
  });

  // init
  wordEl.style.fontSize = fontSlider.value + 'px';
  loadWords();
})();
</script>
</body>
</html>
